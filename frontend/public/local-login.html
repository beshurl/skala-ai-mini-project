<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로컬 로그인 · RE:CASE</title>
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body>
    <header>RE:CASE <span>이 Mac의 로컬 작업실</span></header>
    <main>
      <h1>로컬 작업실에 로그인</h1>
      <p>이 Mac에 저장된 접근키를 입력하세요. 인증은 1시간 동안 유지되며 서버를 재시작하면 종료됩니다.</p>
      <form method="post" action="/api/local-login">
        <label for="access-key">로컬 접근키</label>
        <input id="access-key" name="access_key" type="password" autocomplete="current-password" required maxlength="128" aria-describedby="key-hint" />
        <p id="key-hint">설정한 접근키 파일의 내용을 복사해 입력하세요.</p>
        <!-- error -->
        <button type="submit">작업실 열기</button>
      </form>
      <p class="scope">현재 제공하는 사건과 인물은 합성 자료입니다.</p>
    </main>
  </body>
</html>
